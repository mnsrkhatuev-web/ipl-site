<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="google" content="notranslate">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="theme-color" content="#0f2741">
    <title>Обучение — админка ИПЛ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=7">
    <link rel="stylesheet" href="admin.css?v=11">
    <script>
        if (!sessionStorage.getItem("ipl_admin_token")) {
            location.replace("./");
        }
    </script>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("ipl-theme");
                var theme = saved === "dark" || saved === "light"
                    ? saved
                    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {}
        })();
    </script>
</head>
<body class="notranslate admin-course-page" data-admin-course="1">
    <header class="admin-header">
        <div class="admin-header-inner">
            <a class="admin-logo" href="./">
                <div class="admin-logo-mark">ИПЛ</div>
                <div class="admin-logo-text">
                    Обучение
                    <span>Только для сотрудников</span>
                </div>
            </a>
            <div class="admin-header-actions">
                <button class="btn btn-ghost theme-toggle" type="button" data-theme-toggle aria-label="Сменить тему" title="Тема">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.3A8.2 8.2 0 1 1 9.7 3a6.6 6.6 0 0 0 11.3 11.3z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <span class="theme-toggle-label">Тема</span>
                </button>
                <a class="btn btn-ghost" href="./">Новости</a>
                <button class="btn btn-ghost" type="button" id="course-logout">Выйти</button>
            </div>
        </div>
    </header>

    <main id="course-app">
        <section class="page-content">
            <div class="container">
                <article class="card">
                    <h3>Загрузка курса…</h3>
                    <p>Подготавливаем учебные модули.</p>
                </article>
            </div>
        </section>
    </main>

    <script src="../script.js?v=6"></script>
    <script src="../course.js?v=7"></script>
    <script>
        document.getElementById("course-logout")?.addEventListener("click", () => {
            sessionStorage.removeItem("ipl_admin_token");
            location.replace("./");
        });
    </script>
</body>
</html>
