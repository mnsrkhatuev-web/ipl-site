services:
  - type: web
    name: ipl-decap-oauth
    runtime: node
    plan: free
    rootDir: oauth-vercel
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: mnsrkhatuev-web/ipl-site
      - key: ALLOWED_ORIGINS
        value: https://ipl-chr.ru,https://www.ipl-chr.ru,https://mnsrkhatuev-web.github.io,http://127.0.0.1:8000,http://localhost:8000
